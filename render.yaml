      - key: SUPABASE_URL
        value: https://ihpjezapyznhzbhxfrvu.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_4PWubQVpA5UHZMVJfmHHgA_HP0qBw9S
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
