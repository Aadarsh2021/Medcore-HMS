name: Supabase Database Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 3 days at 04:00 UTC (well within the 7-day inactivity window)
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  keep-alive:
    name: Keep Supabase Project Active
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API Gateway (curl)
        run: |
          echo "Sending HTTP heartbeat to Supabase Gateway..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_4PWubQVpA5UHZMVJfmHHgA_HP0qBw9S" \
            "https://ihpjezapyznhzbhxfrvu.supabase.co/auth/v1/health")
          echo "Supabase Auth Health Response Code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Supabase HTTP Heartbeat successfully registered!"
          else
            echo "❌ Supabase HTTP Heartbeat failed with status $STATUS"
            exit 1
          fi
