name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @medcore/api exec prisma generate --schema=prisma/schema.prisma

      - name: Build Monorepo
        run: |
          pnpm --filter @medcore/types build
          pnpm --filter @medcore/api build
          pnpm --filter @medcore/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ihpjezapyznhzbhxfrvu.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_4PWubQVpA5UHZMVJfmHHgA_HP0qBw9S' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "medcore-hms-eea8e"

      - name: Deploy to Firebase Hosting (via Service Account)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEDCORE_HMS_EEA8E != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEDCORE_HMS_EEA8E }}'
          channelId: live
          projectId: medcore-hms-eea8e

      - name: Deploy to Firebase Hosting (via FIREBASE_TOKEN)
        if: ${{ secrets.FIREBASE_TOKEN != '' && secrets.FIREBASE_SERVICE_ACCOUNT_MEDCORE_HMS_EEA8E == '' }}
        run: |
          npx -y firebase-tools deploy --only hosting --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}" --project medcore-hms-eea8e

      - name: Check Deployment Credentials
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEDCORE_HMS_EEA8E == '' && secrets.FIREBASE_TOKEN == '' }}
        run: |
          echo "ℹ️ Notice: GitHub Secrets does not have FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT_MEDCORE_HMS_EEA8E configured yet."
          echo "Build succeeded cleanly! To enable automated remote deployment on git push, add FIREBASE_TOKEN to GitHub repository secrets."
