name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy to Firebase
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate --schema=prisma/schema.prisma

      - name: Build Monorepo
        run: |
          pnpm --filter @medcore/types build
          pnpm --filter @medcore/api build
          pnpm --filter @medcore/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ihpjezapyznhzbhxfrvu.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_4PWubQVpA5UHZMVJfmHHgA_HP0qBw9S"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "medcore-hms-eea8e"

      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_TOKEN != ''
        run: |
          npx -y firebase-tools deploy --only hosting --non-interactive --token "$FIREBASE_TOKEN" --project medcore-hms-eea8e

      - name: Check Deployment Credentials
        if: env.FIREBASE_TOKEN == ''
        run: |
          echo "ℹ️ Notice: FIREBASE_TOKEN is not configured in GitHub Secrets."
          echo "Build succeeded cleanly! Add FIREBASE_TOKEN to repository secrets at https://github.com/Aadarsh2021/Medcore-HMS/settings/secrets/actions."
