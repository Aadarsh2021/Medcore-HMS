name: MedCore HMS — Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate --schema=prisma/schema.prisma

      - name: Build Shared Types Package
        run: pnpm --filter @medcore/types build

      - name: Build NestJS API (@medcore/api)
        run: pnpm --filter @medcore/api build

      - name: Build Next.js 15 Frontend (@medcore/web)
        run: pnpm --filter @medcore/web build
